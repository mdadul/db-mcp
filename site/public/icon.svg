    <path d="M376 356 L384 330 L266 280 L136 333 V468 C136 516 196 548 266 575 C326 548 360 520 364 486"
          fill="none" stroke="url(#shield)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- database: three layers -->
