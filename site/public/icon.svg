      <path d="M188 370 A75 28 0 0 1 338 370 V390 A75 28 0 0 1 188 390 Z"/>
      <path d="M188 404 A75 28 0 0 0 338 404 V424 A75 28 0 0 1 188 424 Z"/>
      <path d="M188 438 A75 28 0 0 0 338 438 V458 A75 28 0 0 1 188 458 Z"/>
    </g>
    <ellipse cx="263" cy="370" rx="75" ry="28" fill="#67E8F9"/>

    <!-- network: connector knocked out of the database, three nodes -->
    <path d="M318 428 H344" stroke="#0B1220" stroke-width="22" stroke-linecap="round"/>
    <g fill="none" stroke="#22D3EE" stroke-width="9" stroke-linecap="round">
      <path d="M318 428 H343 M364 417 L397 394 M364 439 L398 465"/>
      <circle cx="354" cy="428" r="12" fill="#0B1220"/>
      <circle cx="408" cy="387" r="13" fill="#0B1220"/>
      <circle cx="409" cy="473" r="13" fill="#0B1220"/>
    </g>
  </g>
</svg>
