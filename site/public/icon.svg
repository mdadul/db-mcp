<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="DB MCP">
  <defs>
    <radialGradient id="bg" cx="0.8" cy="0.15" r="1">
      <stop offset="0" stop-color="#10224A"/>
      <stop offset="0.6" stop-color="#0B1220"/>
    </radialGradient>
    <linearGradient id="shield" x1="130" y1="560" x2="390" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="db" x1="0" y1="340" x2="0" y2="510" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="#2563EB" stroke-opacity="0.45" stroke-width="6"/>

  <g transform="translate(-24 -171)">
