services:
  db-mcp:
    image: mdadul/db-mcp:latest
    # build: .
    ports:
      - "4080:4080"
    volumes:
      # Persist the SQLite control-plane DB and generated .env across restarts.
      - ./data:/data
      - ./.env:/app/.env
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
