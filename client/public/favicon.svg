<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="dbMcpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="45%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="dbMcpGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#500724" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#dbMcpBg)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  
  <!-- Subtle Top Gloss -->
  <path d="M 2 18 C 2 9.163 9.163 2 18 2 L 46 2 C 54.837 2 62 9.163 62 18 L 62 26 C 62 26 44 32 32 32 C 20 32 2 26 2 26 Z" fill="url(#dbMcpGlow)" />

  <!-- Database & Gateway Icon -->
  <g filter="url(#shadow)" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top Cap / Platter -->
    <ellipse cx="32" cy="20" rx="15" ry="5.5" fill="#ffffff" fill-opacity="0.95" stroke="none" />
    <ellipse cx="32" cy="20" rx="15" ry="5.5" stroke="#ffffff" stroke-width="2" />
    
    <!-- Middle Tier Curve -->
    <path d="M 17 20 V 29 C 17 32.5 23.7 35 32 35 C 40.3 35 47 32.5 47 29 V 20" />
    
    <!-- Bottom Tier Curve -->
    <path d="M 17 29 V 38 C 17 41.5 23.7 44 32 44 C 40.3 44 47 41.5 47 38 V 29" />

    <!-- Center Bridge Line & Hub -->
    <line x1="32" y1="20" x2="32" y2="44" stroke="#ffffff" stroke-width="2" stroke-dasharray="2 3" opacity="0.6" />
  </g>

  <!-- Active Bridge Pulse Indicator (Top Right) -->
  <circle cx="49" cy="15" r="4.5" fill="#10b981" stroke="#ffffff" stroke-width="2" />
</svg>
