[package]
name = "db-mcp-desktop"
version = "0.1.1"
description = "DB MCP Desktop"
authors = ["DB MCP"]
edition = "2021"

[lib]
name = "db_mcp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "db-mcp-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = { version = "2", optional = true }
tokio = { version = "1", features = ["io-util", "macros", "process", "signal", "sync", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[features]
default = []
# Enable only in signing-enabled release builds; updater artifacts need TAURI_SIGNING_PRIVATE_KEY.
updater = ["dep:tauri-plugin-updater"]
