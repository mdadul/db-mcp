name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # No lockfile is committed (bun.lock only), so install with npm install.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Check evaluation answers against seed data
        run: python3 evals/verify.py

      - name: Build
        run: npm run build

      - name: Pack
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          echo "TARBALL=$(ls "$RUNNER_TEMP"/mdadul-db-mcp-*.tgz)" >> "$GITHUB_ENV"

      - name: Smoke test packed tarball
        run: |
          APP=$(mktemp -d)
          cd "$APP" && npm init -y >/dev/null
          npm install "$TARBALL" --no-audit --no-fund
          DB_MCP_HOME="$APP/home" node node_modules/@mdadul/db-mcp/dist/cli.js --version
          DB_MCP_HOME="$APP/home" PORT=4090 node node_modules/@mdadul/db-mcp/dist/cli.js &
          PID=$!
          for i in $(seq 1 20); do
            curl -s -o /dev/null localhost:4090/ && break
            sleep 0.5
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:4090/mcp)" = "401"
          kill "$PID"
