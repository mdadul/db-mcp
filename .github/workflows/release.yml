name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # All targets upload to the same draft release and latest.json asset.
      # Serialize uploads so matrix jobs cannot race on shared release assets.
      max-parallel: 1
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          # macos-13 and macos-14 are retired; macos-15-intel is the Intel macOS runner.
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache JavaScript package downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.npm
          key: release-deps-${{ runner.os }}-bun-1.3.14-node26-${{ hashFiles('bun.lock', 'package.json', 'client/package.json') }}
          restore-keys: |
            release-deps-${{ runner.os }}-bun-1.3.14-node26-

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          shared-key: tauri-${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsecret-1-dev \
            libdbus-1-dev \
            build-essential

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      # Tauri updater releases require the private signing key. Apple signing
      # secrets remain optional so unsigned macOS bundles can still be built.
      - name: Export optional signing secrets
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required to build updater artifacts" >&2
            exit 1
          fi
          for name in \
            APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
            TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            value="${!name}"
            if [ -n "$value" ]; then
              {
                echo "$name<<__EOF_${name}__"
                echo "$value"
                echo "__EOF_${name}__"
              } >> "$GITHUB_ENV"
            fi
          done

      # TODO: Windows code signing (Authenticode, e.g. signtool or Azure
      # Trusted Signing). Add the certificate secrets and a signing step here.

      - name: Build and publish draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple Developer ID yet: ad-hoc sign ("-") so the macOS bundle is sealed.
          # Notarization is skipped without APPLE_ID. A real identity from secrets takes over.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
        with:
          projectPath: desktop/src-tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "DB MCP v__VERSION__"
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
